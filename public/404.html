<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electro</title>
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var location = window.location;
        var pathSegments = location.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/");
        var basePath =
          location.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") + "/";
        var query = pathSegments.replace(/&/g, "~and~");

        if (location.search) {
          query += "&" + location.search.slice(1).replace(/&/g, "~and~");
        }

        location.replace(
          location.protocol +
            "//" +
            location.hostname +
            (location.port ? ":" + location.port : "") +
            basePath +
            "?" +
            "/" +
            query +
            location.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
